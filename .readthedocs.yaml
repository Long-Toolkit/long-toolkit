version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.10"
  jobs:
    build:
      html:
        - python -m zensical.main build
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/

python:
  install:
    - method: uv
      command: sync
      groups:
        - dev
