[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "long-toolkit"
version = "0.0.5"
description = "A hub of Python toolkits for longitudinal data, from preparation and preprocessing to benchmarking and modelling."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Simon Provost", email = "simon.g.provost@mcgill.ca" },
  { name = "Bianca Branco", email = "s2714881@sms.ed.ac.uk" },
  { name = "Alex Kwong", email = "akwong@ed.ac.uk" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "beartype>=0.18.5",
  "rich>=13.7.1",
  "rich-pyfiglet>=1.0.0",
  "numpy>=1.26.4",
  "scipy>=1.11,<1.15; sys_platform == 'darwin'",
  "pandas>=2.2.2",
  "PyYAML>=6.0.2",
  "scikit-learn>=1.4.2,<1.6",
  "terminaltexteffects>=0.14.2",
  "skrub==0.6.2",
  "miceforest>=6.0.5",
  "notebook>=7.5.3",
  "shap>=0.49.1",
  "pipelineprofiler>=0.1.18",
  "setuptools<81",
  "imbalanced-learn==0.12.4",
  "optuna>=4.2,<5",
  "xgboost>=2.1,<3",
  "scikit-longitudinal>=0.1.10",
]

[project.scripts]
long-toolkit-bridge = "long_toolkit.bridge.runner:main"

[tool.uv]
default-groups = ["dev"]
override-dependencies = [
    "scikit-learn ; sys_platform == 'never'",
]

[dependency-groups]
dev = [
  { include-group = "docs" },
  "pytest>=8.3",
  "black>=24.4.2",
  "flake8>=7.1.0",
  "pre-commit>=3.7.1",
  "ruff>=0.5.0",
]
docs = [
  "mkdocstrings[python]==1.0.6",
  "mkdocstrings-python==2.0.3",
  "zensical==0.0.67",
  "pymdown-extensions==11.0.2",
  "tomli==2.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["long_toolkit", "long_toolkit.*"]

[tool.setuptools.package-data]
"long_toolkit.data_preparation.config" = ["*.json"]
"long_toolkit.data_preprocessing.config" = ["*.json"]
"long_toolkit.explainability.config" = ["*.json"]
"long_toolkit.machine_learning.config" = ["*.json"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E501"]
