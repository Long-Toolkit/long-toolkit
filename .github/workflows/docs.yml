name: Build Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'requirements-dev.txt'
      - '.readthedocs.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**/*.py'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'requirements-dev.txt'
      - '.readthedocs.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**/*.py'

jobs:
  build:
    if: >-
      ${{
        (github.event_name == 'push' && !contains(github.event.head_commit.message, '[no-build]')) ||
        (github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.title, '[no-build]') &&
          !contains(github.event.pull_request.body || '', '[no-build]'))
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Create virtual environment
        run: uv venv --python 3.10

      - name: Install dependencies
        run: uv pip install --require-hashes -r requirements-dev.txt

      - name: Verify the requirements export
        run: |
          uv export --locked --only-group docs --no-header --output-file /tmp/requirements-dev.txt
          diff -u requirements-dev.txt /tmp/requirements-dev.txt

      - name: Build documentation
        run: uv run --no-sync zensical build --strict
